# ============================================================================
#  FFAMapSwitcher - maps
#
#  Every map is a Multiverse world rebuilt from a clean template:
#
#    map-templates/<template>/   the untouched copy - never loaded, never written
#    <world>/                    the live copy players fight in
#
#  The live copy is rebuilt from the template when its round ends, and checked
#  again right before it loads, so every game starts on the same map. To change
#  a map for good, edit its TEMPLATE with the server stopped.
#
#  Per map:
#    name           shown to players (small caps are applied for you)
#    world          the live world's folder and Multiverse name
#    template       folder inside templates.folder (config.yml)
#    icon           an <icon:name> from gui.yml
#    material       the menu item Java players see
#    bedrock-image  a Bedrock texture path, or an https:// image, for the form button
#    credit         who built it
#    spawns         where players arrive; one is picked at random.
#                   Set in game: /ffamap admin setspawn <map>  (addspawn for more)
#                   A spawn with no y lands on the highest block there.
#    border         set in game: /ffamap admin setborder <map> <size>
#                   (centred where you stand; size is the full width in blocks)
#    time           fixed time of day, 0-24000. Remove it to leave time alone.
#    generator      overrides worlds.generator in config.yml ("none" for terrain)
#    gamerules      overrides for config.yml worlds.gamerules
#    random-radius  players arrive at a random safe spot this far from the map's
#                   centre - overrides config.yml arrival.random-radius; 0 = the
#                   spawns above
#    enabled        false keeps a map out of the rotation
#
#  Borders were centred and sized in game by staff. Each spawn sits on the
#  highest block at its border's centre until you stand somewhere better and
#  run /ffamap admin setspawn <map>.
# ============================================================================

