    # world
    house:         "\uE5F1"   # ui4_houseicon
    castle:        "\uE5DB"   # ui4_castle
    cave:          "\uE5DC"   # ui4_caveicon
    tree:          "\uE5D3"   # ui3_treeicon
    water:         "\uE5D4"   # ui3_watericon
    lava:          "\uE5F3"   # ui4_lavaicon
    sun:           "\uE5CF"   # ui3_sunicon
    torch:         "\uE5D1"   # ui3_torchicon
    grass:         "\uE5EC"   # ui4_grassblock
    rocket:        "\uE593"   # ui2_rocket

    # map switcher windows (Nullscape Nexo glyphs/ffamap.yml)
