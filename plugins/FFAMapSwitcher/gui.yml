# ============================================================================
#  FFAMapSwitcher - interfaces
#
#  The menus Java players see, and the forms Bedrock players see.
#  The look matches FFACore: small caps, accent #FF6BE8, values #FFA347,
#  good #5BF57A, bad #FF5C5C, warn #FFD34E, chrome #5A5A6E.
#
#  One rule for pack artwork (<icon:name>): <white> immediately before it,
#  every time. Minecraft multiplies a glyph by the colour of the text it sits
#  in, and a window title is drawn dark grey - so an unwrapped glyph comes out
#  muddy there. Wrapped, it draws white, which is why the titles below carry
#  one. Bedrock players are never sent artwork at all; their forms are plain.
# ============================================================================

config-version: 5

# --------------------------------------------------------------------- design
#
#  The shared visual language, the same one FFACore's NPC menus are drawn with.
#  Change it here and both windows follow.
design:

  # The thin divider <rule> expands to, usable in any lore line or message.
  # Plain bars rather than a pack glyph, so it still draws for a player who
  # declined the resource pack, and dim enough to separate lines without
  # competing with them.
  rule: "<#5A5A6E>||||||||||||||||||||||"

  # The frame. Tiles are placed first; this fills whatever slots they leave.
  #
  #   border      the edge of the window
  #   background  every slot still empty after that
  #
  # Plain grey glass round the edge and nothing else: the tiles are what a
  # player came for, and a window packed with coloured glass only competes
  # with them. hide-tooltip stops a frame pane throwing up an empty tooltip
  # box whenever the cursor crosses it.
  chrome:
    border:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      hide-tooltip: true
    background:
      enabled: false
      material: BLACK_STAINED_GLASS_PANE
      hide-tooltip: true

# ------------------------------------------------------------------ the vote
#
#  Option placeholders: <map> <map_icon> <credit> <votes> <percent> <time>
#  and, as whole lines, <rule> <credit_line> <bar> <status>.
vote-menu:
  # The Nexo panel drawn behind this window (menus.custom-textures in
  # config.yml): the first map on the left, the timer in the middle, the
  # second map on the right - a click anywhere on a map's panel votes for it.
  # Java players with the pack only; everyone else gets the tiles below.
  #   glyph        an icon name from icons: at the bottom of this file
  #   width        the texture's width in pixels
  #   title        written on top of the texture
  #   title-align  center (the middle of the window) or left
  texture:
    enabled: true
    glyph: ffamap_vote
    width: 176
    title: "<white>ᴍᴀᴘ ᴠᴏᴛᴇ"
    title-align: center
  title: "<white><icon:map></white> ᴍᴀᴘ ᴠᴏᴛᴇ"
  rows: 3
  # An item in every slot the frame leaves empty, for this window only.
  # "none" = whatever design.chrome.background says, which is nothing.
  filler: "none"
  slots:
    info: 4
    options: [11, 15]
    close: 26

  info:
    material: CLOCK
    name: "<white><icon:hourglass> <white>ᴠᴏᴛᴇ ꜰᴏʀ ᴛʜᴇ ɴᴇxᴛ ᴍᴀᴘ"
    lore:
      - "<rule>"
      - "<gray>ᴄʟᴏꜱᴇꜱ ɪɴ <#5A5A6E>• <#FFA347><time>"
      - "<gray>ɴᴏᴡ ᴘʟᴀʏɪɴɢ <#5A5A6E>• <white><current>"
      - "<gray>ᴠᴏᴛᴇꜱ ᴄᴀꜱᴛ <#5A5A6E>• <#FFA347><total>"
      - "<rule>"

  option:
    name: "<map_icon><white><map>"
    lore:
      - "<rule>"
      - "<credit_line>"
      - "<gray>ᴠᴏᴛᴇꜱ <#5A5A6E>• <#FFA347><votes> <#5A5A6E>• <#FFA347><percent>%"
      - "<bar>"
      - ""
      - "<status>"
      - "<rule>"
    credit: "<#5A5A6E>ʙʏ <gray><credit>"
    voted: "<white><icon:check> <#5BF57A>ʏᴏᴜʀ ᴠᴏᴛᴇ"
    not-voted: "<#5BF57A>» <gray>ᴄʟɪᴄᴋ ᴛᴏ ᴠᴏᴛᴇ"
    glow-when-voted: true

  close:
    material: BARRIER
    name: "<white><icon:cross> <#FF5C5C>ᴄʟᴏꜱᴇ"

  # Plain Unicode blocks, not pack glyphs: a vote count is information, so it
  # has to survive a declined resource pack. Blocks rather than the bars
  # FFACore fills its progress with, because this one sits two lines under a
  # <rule> and a row of thin bars there reads as a second rule.
  bar:
    length: 10
    filled: "▰"
    empty: "▱"
    filled-style: "<#FF6BE8>"
    empty-style: "<#5A5A6E>"

# ------------------------------------------------------------ the NPC confirm
#
#  What the map NPC shows between votes. Nothing happens until ᴛᴇʟᴇᴘᴏʀᴛ.
#  Placeholders: <map> <map_icon> <credit> <time> <players>, and <rule> and
#  <credit_line> as whole lines (the credit is dropped when a map has none).
confirm-menu:
  # The Nexo panel: teleport on the left, the map in the middle, cancel on
  # the right. Each whole panel is the button. See vote-menu for the keys.
  texture:
    enabled: true
    glyph: ffamap_confirm
    width: 176
    title: "<white>ᴄᴜʀʀᴇɴᴛ ᴍᴀᴘ"
    title-align: center
  title: "<white><icon:map></white> ᴄᴜʀʀᴇɴᴛ ᴍᴀᴘ"
  rows: 3
  # An item in every slot the frame leaves empty, for this window only.
  # "none" = whatever design.chrome.background says, which is nothing.
  filler: "none"
  slots:
    confirm: 11
    map: 13
    cancel: 15

  map:
    name: "<map_icon><white><map>"
    lore:
      - "<rule>"
      - "<credit_line>"
      - "<gray>ᴛɪᴍᴇ ʟᴇꜰᴛ <#5A5A6E>• <#FFA347><time>"
      - "<rule>"
    credit: "<#5A5A6E>ʙʏ <gray><credit>"

  confirm:
    material: LIME_DYE
    name: "<white><icon:check> <#5BF57A>ᴛᴇʟᴇᴘᴏʀᴛ"
    lore:
      - "<rule>"
      - "<gray>ᴊᴜᴍᴘ ɪɴᴛᴏ <white><map>"
      - "<rule>"

  cancel:
    material: RED_DYE
    name: "<white><icon:cross> <#FF5C5C>ᴄᴀɴᴄᴇʟ"
    lore:
      - "<rule>"
      - "<gray>ꜱᴛᴀʏ ɪɴ ᴛʜᴇ ʟᴏʙʙʏ"
      - "<rule>"

# -------------------------------------------------------------- Bedrock forms

bedrock-form:
  title: "ᴍᴀᴘ ᴠᴏᴛᴇ"
  content: "<gray>ᴘɪᴄᴋ ᴛʜᴇ ɴᴇxᴛ ᴍᴀᴘ\n<gray>ᴠᴏᴛɪɴɢ ᴄʟᴏꜱᴇꜱ ɪɴ <#FFA347><time>"
  button: "<#FF6BE8><map>\n<gray><votes> ᴠᴏᴛᴇꜱ"
  voted-button: "<#5BF57A>✔ <map>\n<gray><votes> ᴠᴏᴛᴇꜱ"

bedrock-confirm:
  title: "ᴄᴜʀʀᴇɴᴛ ᴍᴀᴘ"
  content: "<white><map>\n\n<gray>ᴛɪᴍᴇ ʟᴇꜰᴛ <#FFA347><time>"
  confirm: "ᴛᴇʟᴇᴘᴏʀᴛ"
  cancel: "ᴄᴀɴᴄᴇʟ"

# ----------------------------------------------------------------------- icons
#
#  The <icon:name> tag, generated from the installed Nexo glyph files
#  (Nullscape Nexo) - the same names and codepoints FFACore uses.
#  Set enabled: false on a server without the pack.
#  Values MUST stay double-quoted: YAML only reads \uXXXX inside double quotes.
icons:
  enabled: true
  glyphs:

    # ---------------------------------------------------------- by meaning
    #
    #  These are the names the shipped configs use. Re-point one here and it
    #  changes everywhere at once - that is the whole reason menus refer to
    #  artwork by name instead of by codepoint.

    # economy
    token:         "\uE5DF"   # ui4_coin1
    coin:          "\uE5E0"   # ui4_coinbagicon
    coins:         "\uE5E1"   # ui4_coinstackicon
    coins_alt:     "\uE5E2"   # ui4_coinstackicon2
    money:         "\uE5C3"   # ui3_moneyicon
    gem:           "\uE5EA"   # ui4_gemicon
    diamond:       "\uE5E4"   # ui4_diamondicon
    shard:         "\uE5CB"   # ui3_shardicon
    orb_blue:      "\uE5DA"   # ui4_blueorbicon
    orb_green:     "\uE5ED"   # ui4_greenorbicon

    # progression
    prestige:      "\uE5E3"   # ui4_crownicon
    crown:         "\uE5E3"   # ui4_crownicon
    star:          "\uE5CD"   # ui3_staricon
    streak:        "\uE5E7"   # ui4_fireicon
    fire:          "\uE5E8"   # ui4_fireicon2
    lightning:     "\uE5BD"   # ui3_lightningicon
    wings:         "\uE5D5"   # ui3_wingsicon
    upgrade:       "\uE58F"   # ui2_levelup
    downgrade:     "\uE58E"   # ui2_leveldown
    heart:         "\uE5D9"   # ui4_bluehearticon
    heart_fire:    "\uE5EE"   # ui4_heartfireicon

    # interfaces
    shop:          "\uE5D8"   # ui4_bagicon
    bank:          "\uE5CE"   # ui3_suitcaseicon
    market:        "\uE569"   # ui1_portal
    kit:           "\uE5EF"   # ui4_helmeticon
    enchant:       "\uE566"   # ui1_openbook
    scroll:        "\uE5CA"   # ui3_scrollicon
    forge:         "\uE551"   # ui1_campfire
    gear:          "\uE5E9"   # ui4_gearicon
    key:           "\uE5F2"   # ui4_keyicon
    lock:          "\uE5BE"   # ui3_lockicon
    clock:         "\uE5DE"   # ui4_clockicon
    hourglass:     "\uE5F0"   # ui4_hourglassicon
    map:           "\uE5BF"   # ui3_mapicon
    potion:        "\uE5C8"   # ui3_potionicon
    potion_alt:    "\uE5C7"   # ui3_potion2icon
    chestplate:    "\uE57F"   # ui2_chestplate
    helmet:        "\uE5EF"   # ui4_helmeticon

    # state
    check:         "\uE5D7"   # ui3_yesicon
    cross:         "\uE5C5"   # ui3_noicon
    question:      "\uE5C9"   # ui3_questionmarkicon
    bell:          "\uE577"   # ui2_bell
    dot:           "\uE578"   # ui2_bluecircle
    bulb:          "\uE5BC"   # ui3_lightbulbicon
    eye:           "\uE5E6"   # ui4_eyeicon
    search:        "\uE5CC"   # ui3_spyglassicon
    skull:         "\uE595"   # ui2_skull
    coffin:        "\uE580"   # ui2_coffin
