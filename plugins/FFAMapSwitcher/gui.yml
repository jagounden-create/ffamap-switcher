    # navigation
    up:            "\uE576"   # ui2_arrowup
    down:          "\uE574"   # ui2_arrowdown
    left:          "\uE575"   # ui2_arrowleft

    # social
    chat:          "\uE5DD"   # ui4_chaticonicon
