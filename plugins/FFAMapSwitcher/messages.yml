# ============================================================================
#  FFAMapSwitcher - messages
#
#  MiniMessage. Lists are several lines; blank entries are spacing. Set a
#  message to "" to switch it off.
#
#  One colour for map names (#FF6BE8), white for numbers, grey for the rest.
#  No prefix on anything - every line says what it is about on its own.
#
#  Map placeholders: <map> <map_name> <map_id> <credit> <map_icon>
#    <map>       the name in small caps
#    <map_name>  the name exactly as maps.yml writes it
#    <map_icon>  the map's Nexo icon plus a space, for Java players only
#
#  Pack artwork: always <white> right before an <icon:...>.
# ============================================================================

config-version: 3

# Kept for older lines that still use <prefix>. Empty on purpose.
prefix: ""

# %ffamap_state% and the staff panel
states:
  loading: "ʟᴏᴀᴅɪɴɢ"
  playing: "ᴘʟᴀʏɪɴɢ"
  voting: "ᴠᴏᴛɪɴɢ"
  starting: "ꜱᴛᴀʀᴛɪɴɢ"

statuses:
  unchecked: "<gray>ᴜɴᴄʜᴇᴄᴋᴇᴅ"
  repairing: "<#FFD34E>ʀᴇꜱᴛᴏʀɪɴɢ"
  ready: "<#5BF57A>ʀᴇᴀᴅʏ"
  loading: "<#FFD34E>ʟᴏᴀᴅɪɴɢ"
  live: "<#FF6BE8>ʟɪᴠᴇ"
  closing: "<#FFD34E>ᴄʟᴏꜱɪɴɢ"
  broken: "<#FF5C5C>ʙʀᴏᴋᴇɴ"
  off: "<#5A5A6E>ᴏᴜᴛ ᴏꜰ ʀᴏᴛᴀᴛɪᴏɴ"

# ----------------------------------------------------------------- the NPC
#
#  The label floating above every map NPC: a big title, the lines under it,
#  then the click line - no panel, just shadowed text. One block per state of
#  the round. A state can set its own click: in place of the shared one.
#  Placeholders: <map> <map_name> <map_icon> <time> <players> and, while
#  voting, <option_1> <option_2> <votes_1> <votes_2>.
hologram:
  click: "<#9A9AAA>→ ᴄʟɪᴄᴋ ᴍᴇ ←"
  loading:
    title: "<white><icon:map> <#FF6BE8>Maps"
    lines:
      - "<gray>ᴛʜᴇ ɴᴇxᴛ ᴍᴀᴘ ɪꜱ ʟᴏᴀᴅɪɴɢ"
    click: ""
  playing:
    title: "<map_icon><#FF6BE8><map_name>"
    lines:
      - "<white><icon:hourglass> <white><time> <gray>ʟᴇꜰᴛ"
  voting:
    title: "<white><icon:map> <#FF6BE8>Map Vote"
    lines:
      - "<white><option_1> <#FFA347><votes_1> <gray>ᴠꜱ <#FFA347><votes_2> <white><option_2>"
      - "<white><icon:hourglass> <gray>ᴇɴᴅꜱ ɪɴ <white><time>"
  starting:
    title: "<map_icon><#FF6BE8><map_name>"
    lines:
      - "<white><icon:hourglass> <gray>ꜱᴛᴀʀᴛꜱ ɪɴ <white><time>"

# -------------------------------------------------------------------- help

help:
  - ""
  - "<#FF6BE8>ᴍᴀᴘꜱ"
  - "<white>/ffamap <gray>ᴘʟᴀʏ ᴏʀ ᴠᴏᴛᴇ, ꜱᴀᴍᴇ ᴀꜱ ᴛʜᴇ ɴᴘᴄ"
  - "<white>/ffamap join <gray>ᴊᴜᴍᴘ ɪɴᴛᴏ ᴛʜᴇ ʟɪᴠᴇ ᴍᴀᴘ"
  - "<white>/ffamap info <gray>ᴡʜᴀᴛ'ꜱ ᴘʟᴀʏɪɴɢ"
  - ""

help-admin:
  - ""
  - "<#FF6BE8>Map switcher <gray>- <white>/ffamap admin <gray>opens the staff panel"
  - "<white>status <gray>- the rotation and every map"
  - "<white>switch <map> <gray>- change map now, no vote"
  - "<white>vote <gray>- open the vote now"
  - "<white>extend <time> <gray>- add time to this round"
  - "<white>tp <map> <gray>- visit a map"
  - "<white>enable | disable <map> <gray>- in or out of the rotation"
  - "<white>setspawn | addspawn | clearspawns <map>"
  - "<white>setborder <map> <size> <gray>- centred where you stand"
  - "<white>border <map> on | off"
  - "<white>setlobby <gray>- where players go back to"
  - "<white>npc add | remove | list <id>"
  - "<white>import [name | all] <gray>- add maps uploaded to the templates folder"
  - "<white>repair <map> <gray>| <white>reload"
  - ""

# -------------------------------------------------------------------- vote
#
#  Voting happens at the NPC and in the vote window - there is no voting in
#  chat.

vote:
  opened:
    - ""
    - "<#FF6BE8>ᴍᴀᴘ ᴠᴏᴛᴇ ɪꜱ ᴏᴘᴇɴ"
    - "<white><option_1> <gray>ᴏʀ <white><option_2> <gray>· ᴛᴀʟᴋ ᴛᴏ ᴛʜᴇ ɴᴘᴄ ᴛᴏ ᴠᴏᴛᴇ"
    - ""
  cast: "<gray>ʏᴏᴜ ᴠᴏᴛᴇᴅ ꜰᴏʀ <#FF6BE8><map>"
  changed: "<gray>ᴠᴏᴛᴇ ᴄʜᴀɴɢᴇᴅ ᴛᴏ <#FF6BE8><map>"
  unchanged: "<gray>ʏᴏᴜ ᴀʟʀᴇᴀᴅʏ ᴠᴏᴛᴇᴅ ꜰᴏʀ <#FF6BE8><map>"
  not-open: "<gray>ᴛʜᴇʀᴇ'ꜱ ɴᴏ ᴠᴏᴛᴇ ʀɪɢʜᴛ ɴᴏᴡ"
  closed: "<#FF6BE8><map> <gray>ᴡᴏɴ ᴛʜᴇ ᴠᴏᴛᴇ"
  no-vote-needed: "<gray>ɴᴇxᴛ ᴍᴀᴘ <#FF6BE8><map>"

# ------------------------------------------------------------------ switch

switch:
  # Action bar while the next map counts down.
  countdown: "<gray>ɴᴇxᴛ ᴍᴀᴘ <#FF6BE8><map> <gray>ɪɴ <white><time>"
  waiting: "<gray>ʟᴏᴀᴅɪɴɢ <#FF6BE8><map>"
  live: "<gray>ɴᴏᴡ ᴘʟᴀʏɪɴɢ <#FF6BE8><map>"
  title: "<#FF6BE8><map>"
  subtitle: "<gray>ɴᴏᴡ ᴘʟᴀʏɪɴɢ"
  moved-lobby: "<gray>ᴛʜᴇ ᴍᴀᴘ ɪꜱ ɴᴏᴡ <#FF6BE8><map> <gray>· ᴛᴀʟᴋ ᴛᴏ ᴛʜᴇ ɴᴘᴄ ᴛᴏ ᴘʟᴀʏ"
  moved-map: "<gray>ᴡᴇʟᴄᴏᴍᴇ ᴛᴏ <#FF6BE8><map>"
  replay: "<#FF6BE8><map> <gray>ᴡᴏɴ ᴀɢᴀɪɴ"
  staying: "<#FF6BE8><map> <gray>ꜱᴛᴀʏꜱ ꜰᴏʀ ᴀɴᴏᴛʜᴇʀ ʀᴏᴜɴᴅ"
  fallback: "<gray>ᴛʜᴀᴛ ᴍᴀᴘ ᴄᴏᴜʟᴅɴ'ᴛ ʟᴏᴀᴅ · ᴘʟᴀʏɪɴɢ <#FF6BE8><map>"
  forced: "<gray>ꜱᴡɪᴛᴄʜɪɴɢ ᴛᴏ <#FF6BE8><map>"

# -------------------------------------------------------------------- join

join:
  # Chat line as the teleport starts. The title below already says where.
  sending: ""
  title: "<#FF6BE8><map>"
  subtitle: "<white><time> <gray>ʟᴇꜰᴛ"
  already-there: "<gray>ʏᴏᴜ'ʀᴇ ᴀʟʀᴇᴀᴅʏ ɪɴ <#FF6BE8><map>"
  loading: "<#FF6BE8><map> <gray>ɪꜱ ʟᴏᴀᴅɪɴɢ · ᴛʀʏ ᴀɢᴀɪɴ ɪɴ ᴀ ᴍᴏᴍᴇɴᴛ"
  gone: "<#FF6BE8><map> <gray>ᴊᴜꜱᴛ ᴇɴᴅᴇᴅ"
  failed: "<#FF5C5C>ᴄᴏᴜʟᴅɴ'ᴛ ᴛᴇʟᴇᴘᴏʀᴛ ʏᴏᴜ ʀɪɢʜᴛ ɴᴏᴡ"

# -------------------------------------------------------------------- info

info:
  playing: "<gray>ɴᴏᴡ ᴘʟᴀʏɪɴɢ <#FF6BE8><map> <gray>· <white><time> <gray>ʟᴇꜰᴛ"
  voting: "<gray>ᴠᴏᴛɪɴɢ <white><option_1> <#FFA347><votes_1> <gray>ᴠꜱ <#FFA347><votes_2> <white><option_2> <gray>· <white><time>"
  starting: "<gray>ɴᴇxᴛ ᴍᴀᴘ <#FF6BE8><map> <gray>ɪɴ <white><time>"
  loading: "<gray>ᴛʜᴇ ᴀʀᴇɴᴀ ɪꜱ ʟᴏᴀᴅɪɴɢ"

# ---------------------------------------------------------------- boss bar

boss-bar:
  voting: "<white><option_1> <#FFA347><votes_1>  <gray>ᴠꜱ  <#FFA347><votes_2> <white><option_2>  <gray>· <white><time>"
  starting: "<gray>ɴᴇxᴛ ᴍᴀᴘ <#FF6BE8><map> <gray>ɪɴ <white><time>"
  waiting: "<gray>ʟᴏᴀᴅɪɴɢ <#FF6BE8><map>"

# ------------------------------------------------------------------- staff
#
#  Staff-only lines stay in normal case, so they are quick to read.

command:
  players-only: "<#FF5C5C>Only players can do that."
  no-permission: "<#FF5C5C>You don't have permission."
  need-map: "<gray>Name a map: <white><maps>"
  unknown-map: "<gray>No map called <white><input><gray>. Maps: <white><maps>"
  bad-number: "<white><input> <gray>isn't a number."
  bad-duration: "<white><input> <gray>isn't a length of time - try 5m or 90s."
  need-size: "<gray>Give a width in blocks: <white>/ffamap admin setborder <map_id> 500"
  need-duration: "<gray>How long? <white>/ffamap admin extend 5m"

